[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Canonical WebSocket idempotency keys are public fixture identifiers."
condition = "AND"
regexTarget = "secret"
regexes = ['''^idem_[a-z0-9_]+$''']
paths = ['''packages/contracts/fixtures/ws/.*\.json$''']

[[rules.allowlists]]
description = "Deterministic integration-test idempotency keys are public identifiers."
condition = "AND"
regexTarget = "secret"
regexes = ['''^idem-integration-[0-9]+$''']
paths = ['''apps/api/internal/integration/.*_test\.go$''']
