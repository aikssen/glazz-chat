name: glazz

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: glazz
      POSTGRES_USER: glazz
      POSTGRES_PASSWORD: glazz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glazz -d glazz"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.0-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - path: ../.env
        required: true
    environment: &api-environment
      GLAZZ_ENV: development
      API_PORT: "8080"
      DATABASE_URL: postgres://glazz:glazz@postgres:5432/glazz?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DATABASE_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: glazz-api
    command: ["/bin/sh", "-c", "/app/migrate up && exec /app/api"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - path: ../.env
        required: true
    environment: *api-environment
    command: ["/app/worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
