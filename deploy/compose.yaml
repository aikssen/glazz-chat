name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

x-app-env: &app-env
  - path: ${GLAZZ_COMPOSE_ENV_FILE:-.env}
    required: true

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.0-alpine3.23
    command: ["redis-server", "--appendonly", "${REDIS_APPENDONLY:?set REDIS_APPENDONLY}"]
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: *app-env
    environment:
      OTEL_SERVICE_NAME: ${API_OTEL_SERVICE_NAME:?set API_OTEL_SERVICE_NAME}
    command: ["/bin/sh", "-c", "/app/migrate up && exec /app/api"]
    ports:
      - ${API_HOST_PORT}:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: *app-env
    environment:
      OTEL_SERVICE_NAME: ${WORKER_OTEL_SERVICE_NAME:?set WORKER_OTEL_SERVICE_NAME}
    command: ["/app/worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - ${WEB_HOST_PORT}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
