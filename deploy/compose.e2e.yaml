services:
  postgres:
    ports: !override
      - "${GLAZZ_E2E_BIND_ADDRESS:?set GLAZZ_E2E_BIND_ADDRESS}:${GLAZZ_E2E_POSTGRES_PORT:?set GLAZZ_E2E_POSTGRES_PORT}:${POSTGRES_PORT:?set POSTGRES_PORT}"

  redis:
    ports: !override
      - "${GLAZZ_E2E_BIND_ADDRESS:?set GLAZZ_E2E_BIND_ADDRESS}:${GLAZZ_E2E_REDIS_PORT:?set GLAZZ_E2E_REDIS_PORT}:${REDIS_PORT:?set REDIS_PORT}"

  api:
    env_file: !override
      - path: ../.env.test.example
        required: true
    environment:
      GLAZZ_ENV: test
      WEB_URL: ${GLAZZ_E2E_WEB_ORIGIN:?set GLAZZ_E2E_WEB_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:${REDIS_PORT}/0
      CORS_ALLOWED_ORIGINS: ${GLAZZ_E2E_WEB_ORIGIN:?set GLAZZ_E2E_WEB_ORIGIN}
      GOOGLE_CALLBACK_URL: ${GLAZZ_E2E_API_ORIGIN:?set GLAZZ_E2E_API_ORIGIN}/api/v1/auth/google/callback
      JWT_ISSUER: ${GLAZZ_E2E_API_ORIGIN:?set GLAZZ_E2E_API_ORIGIN}
      BOOTSTRAP_ADMIN_EMAILS: visual-e2e@glazz.test
      OAUTH_TEST_MODE: "true"
      OAUTH_TEST_EMAIL: visual-e2e@glazz.test
      LLM_PROVIDER_KIND: fake
      LLM_PROVIDER_BASE_URL: ""
      LLM_PROVIDER_API_KEY: ""
    ports: !override
      - "${GLAZZ_E2E_BIND_ADDRESS:?set GLAZZ_E2E_BIND_ADDRESS}:${GLAZZ_E2E_API_PORT:?set GLAZZ_E2E_API_PORT}:${API_PORT:?set API_PORT}"

  worker:
    env_file: !override
      - path: ../.env.test.example
        required: true
    environment:
      GLAZZ_ENV: test
      WEB_URL: ${GLAZZ_E2E_WEB_ORIGIN:?set GLAZZ_E2E_WEB_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:${REDIS_PORT}/0
      CORS_ALLOWED_ORIGINS: ${GLAZZ_E2E_WEB_ORIGIN:?set GLAZZ_E2E_WEB_ORIGIN}
      GOOGLE_CALLBACK_URL: ${GLAZZ_E2E_API_ORIGIN:?set GLAZZ_E2E_API_ORIGIN}/api/v1/auth/google/callback
      JWT_ISSUER: ${GLAZZ_E2E_API_ORIGIN:?set GLAZZ_E2E_API_ORIGIN}
      BOOTSTRAP_ADMIN_EMAILS: visual-e2e@glazz.test
      OAUTH_TEST_MODE: "true"
      OAUTH_TEST_EMAIL: visual-e2e@glazz.test
      LLM_PROVIDER_KIND: fake
      LLM_PROVIDER_BASE_URL: ""
      LLM_PROVIDER_API_KEY: ""

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${GLAZZ_E2E_API_ORIGIN:?set GLAZZ_E2E_API_ORIGIN}
    environment:
      NEXT_PUBLIC_API_URL: ${GLAZZ_E2E_API_ORIGIN:?set GLAZZ_E2E_API_ORIGIN}
    ports: !override
      - "${GLAZZ_E2E_BIND_ADDRESS:?set GLAZZ_E2E_BIND_ADDRESS}:${GLAZZ_E2E_WEB_PORT:?set GLAZZ_E2E_WEB_PORT}:${WEB_PORT:?set WEB_PORT}"
