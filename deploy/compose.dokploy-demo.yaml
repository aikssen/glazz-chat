name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

services:
  postgres:
    extends:
      file: compose.dokploy.yaml
      service: postgres

  redis:
    extends:
      file: compose.dokploy.yaml
      service: redis

  api:
    extends:
      file: compose.dokploy.yaml
      service: api
    ports:
      - "${API_BIND_ADDRESS:?set API_BIND_ADDRESS}:${API_HOST_PORT:?set API_HOST_PORT}:${API_PORT:?set API_PORT}"

  worker:
    extends:
      file: compose.dokploy.yaml
      service: worker

  web:
    extends:
      file: compose.dokploy.yaml
      service: web
    ports:
      - "${WEB_BIND_ADDRESS:?set WEB_BIND_ADDRESS}:${WEB_HOST_PORT:?set WEB_HOST_PORT}:${WEB_PORT:?set WEB_PORT}"

volumes:
  postgres-data:
  redis-data:
