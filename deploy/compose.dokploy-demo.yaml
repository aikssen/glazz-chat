name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

services:
  postgres:
    extends:
      file: compose.dokploy.yaml
      service: postgres

  redis:
    extends:
      file: compose.dokploy.yaml
      service: redis

  api:
    extends:
      file: compose.dokploy.yaml
      service: api
    ports:
      - ${API_HOST_PORT}:8080

  worker:
    extends:
      file: compose.dokploy.yaml
      service: worker

  web:
    extends:
      file: compose.dokploy.yaml
      service: web
    ports:
      - ${WEB_HOST_PORT}:3000

volumes:
  postgres-data:
  redis-data:
