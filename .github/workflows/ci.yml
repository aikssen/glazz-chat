name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GLAZZ_ENV_FILE: ${{ github.workspace }}/.env.test.example
      DATABASE_URL: postgres://glazz:glazz@localhost:5432/glazz?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: glazz
          POSTGRES_USER: glazz
          POSTGRES_PASSWORD: glazz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glazz -d glazz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:generate
      - run: pnpm db:generate
      - name: Reject generated contract drift
        run: git diff --exit-code
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GLAZZ_ENV_FILE: ${{ github.workspace }}/.env.test.example
      DATABASE_URL: postgres://glazz:glazz@localhost:5432/glazz?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      OAUTH_TEST_MODE: "true"
      OAUTH_TEST_EMAIL: glazz-e2e-ci@example.test
      BOOTSTRAP_ADMIN_EMAILS: glazz-e2e-ci@example.test
      AUTH_RECENT_TTL: 5s
      E2E_OAUTH: "true"
      E2E_PWA: "true"
      E2E_RECENT_AUTH: "true"
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: glazz
          POSTGRES_USER: glazz
          POSTGRES_PASSWORD: glazz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glazz -d glazz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install chromium --with-deps
      - name: Start API
        working-directory: apps/api
        run: |
          go build -o "$RUNNER_TEMP/glazz-api" ./cmd/api
          "$RUNNER_TEMP/glazz-api" > "$RUNNER_TEMP/glazz-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/glazz-api.pid"
      - name: Wait for API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/glazz-api.log"
          exit 1
      - run: pnpm e2e
      - name: Restart API for guest edge acceptance
        working-directory: apps/api
        env:
          GUEST_SESSION_TTL: 15s
          LLM_FAKE_OUTPUT_TOKENS: "1999"
        run: |
          kill "$(cat "$RUNNER_TEMP/glazz-api.pid")"
          wait "$(cat "$RUNNER_TEMP/glazz-api.pid")" 2>/dev/null || true
          "$RUNNER_TEMP/glazz-api" > "$RUNNER_TEMP/glazz-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/glazz-api.pid"
      - name: Wait for guest edge API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/glazz-api.log"
          exit 1
      - name: Verify guest token and expiry edges
        env:
          E2E_GUEST_EDGES: "true"
          E2E_GUEST_TTL_MS: "15000"
        run: >-
          pnpm --filter @glazz/web exec playwright test
          --project mobile-375
          --grep "guest output budget|expired guest"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/api/go.sum
      - name: Audit Go dependencies
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Scan repository history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .
