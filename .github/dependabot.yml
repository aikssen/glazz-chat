version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Mirrors the npm cooldown below so a fresh release is not proposed before it
    # has had time to be noticed.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # pnpm 11 enforces `minimumReleaseAge` (1440 minutes by default), and
    # `pnpm install --frozen-lockfile` fails in CI when the lockfile contains a
    # version younger than that. Without a cooldown Dependabot proposes releases
    # hours old, and every one of those pull requests is red on arrival through no
    # fault of the dependency. Three days clears the policy with margin; majors get
    # longer to soak.
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # @types/node must track the pinned Node runtime (24.13.0 in .tool-versions
      # and in every CI job). A newer major types APIs the runtime does not have,
      # and tsc would accept them: the failure surfaces at runtime, not in CI.
      # Remove this entry in the same change that moves the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: ci
      include: scope
