version: 2

# Tuned for a single maintainer. The goals, in order:
#
# 1. A vulnerability should reach me quickly. Dependabot *security* updates are
#    not configured here — they are enabled at the repository level and are not
#    grouped or delayed by this file, so they still arrive one per advisory.
# 2. Routine upgrades should not arrive as a stream of individual pull requests.
#    Every ecosystem is grouped into one pull request per month.
# 3. Nothing should be proposed while it is still fresh. A 30-day cooldown also
#    keeps the lockfile clear of pnpm's `minimumReleaseAge` policy (1440 minutes)
#    by a wide margin, so routine bumps are not red on arrival.
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 30
      semver-major-days: 60
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    cooldown:
      default-days: 30
      semver-major-days: 60
    groups:
      # Two groups rather than one: a production bump deserves a closer read than
      # a tooling bump, and keeping them apart means one risky dependency does not
      # hold up the rest.
      production:
        dependency-type: production
        patterns: ["*"]
      development:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # @types/node must track the pinned Node runtime (24.13.0 in .tool-versions
      # and in every CI job). A newer major types APIs the runtime does not have,
      # and tsc would accept them: the failure surfaces at runtime, not in CI.
      # Remove this entry in the same change that moves the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Only default-days here: Dependabot rejects the semver-* keys for this
    # ecosystem, since action releases are not treated as semver.
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
